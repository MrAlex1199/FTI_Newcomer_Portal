<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 780" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Shadow filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="60" y="55" font-size="24" font-weight="800" fill="#1e40af">Org Chart Vertical Stacking: Connector Line Defect Analysis &amp; Fix</text>
  <text x="60" y="85" font-size="15" font-weight="500" fill="#64748b">การวิเคราะห์เปรียบเทียบข้อผิดพลาดของเส้นเชื่อมโยงเมื่อผู้ใต้บังคับบัญชา &gt; 1 คน และการแก้ไขด้วย Precision Bracket System</text>

  <!-- ================= LEFT PANEL: DEFECT (ปัญหาเดิม) ================= -->
  <rect x="50" y="120" width="510" height="610" rx="20" fill="#fff5f5" stroke="#dc2626" stroke-width="2" />
  <text x="75" y="155" font-size="17" font-weight="700" fill="#b91c1c">❌ ปัญหาเดิม: เส้นลอย ไม่เชื่อมต่อ และเลยออกนอกการ์ด</text>

  <!-- Left: Manager Card (Anucha Rattanakul) -->
  <rect x="195" y="195" width="220" height="70" rx="14" fill="#ffffff" stroke="#1e3a5f" stroke-width="2" filter="url(#card-shadow)" />
  <text x="305" y="225" font-size="14" font-weight="700" fill="#1e3a5f" text-anchor="middle">Anucha R. (Manager)</text>
  <text x="305" y="248" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">IT Manager</text>

  <!-- Defect 1: Stem dangling in middle -->
  <line x1="305" y1="265" x2="305" y2="300" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4,4" />
  <circle cx="305" cy="300" r="4" fill="#dc2626" />
  <rect x="325" y="270" width="210" height="42" rx="8" fill="#fee2e2" stroke="#f87171" stroke-width="1" />
  <text x="335" y="288" font-size="11" font-weight="700" fill="#991b1b">1. ก้านกลางห้อยลอยค้างในอากาศ</text>
  <text x="335" y="304" font-size="10" font-weight="500" fill="#b91c1c">ไม่มีเส้นเลี้ยว (Bridge) ไปหาแกนซ้าย</text>

  <!-- Defect 2: Floating vertical spine on left -->
  <line x1="155" y1="295" x2="155" y2="610" stroke="#dc2626" stroke-width="2.5" />
  <circle cx="155" cy="295" r="4" fill="#dc2626" />
  <rect x="65" y="280" width="80" height="50" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1" />
  <text x="105" y="300" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">2. แกนซ้าย</text>
  <text x="105" y="314" font-size="9" font-weight="500" fill="#b91c1c" text-anchor="middle">งอกจาก top-0</text>
  <text x="105" y="326" font-size="9" font-weight="500" fill="#b91c1c" text-anchor="middle">ลอยไม่มีที่มา</text>

  <!-- Branch 1 into Naruemon -->
  <line x1="155" y1="365" x2="195" y2="365" stroke="#dc2626" stroke-width="2" />
  <rect x="195" y="335" width="220" height="60" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="305" y="362" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Naruemon Pansri</text>
  <text x="305" y="380" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Software Developer</text>

  <!-- Branch 2 into Kittipong -->
  <line x1="155" y1="455" x2="195" y2="455" stroke="#dc2626" stroke-width="2" />
  <rect x="195" y="425" width="220" height="60" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="305" y="452" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Kittipong Sae-ung</text>
  <text x="305" y="470" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">IT Support Specialist</text>

  <!-- Defect 3: Bottom Overshoot -->
  <circle cx="155" cy="610" r="4" fill="#dc2626" />
  <rect x="80" y="540" width="260" height="52" rx="8" fill="#fee2e2" stroke="#f87171" stroke-width="1" />
  <text x="90" y="560" font-size="11" font-weight="700" fill="#991b1b">3. เส้นดิ่งวิ่งเลยการ์ดใบสุดท้าย</text>
  <text x="90" y="576" font-size="10" font-weight="500" fill="#b91c1c">(Overshoot bottom-6 แหลมห้อยลงมา</text>
  <text x="90" y="588" font-size="10" font-weight="500" fill="#b91c1c">เพราะไม่ได้หยุดที่กึ่งกลางการ์ดสุดท้าย)</text>

  <!-- ================= RIGHT PANEL: PRECISION BRACKET FIX (การแก้ไข) ================= -->
  <rect x="580" y="120" width="530" height="610" rx="20" fill="#f0fdf4" stroke="#047857" stroke-width="2" />
  <text x="605" y="155" font-size="17" font-weight="700" fill="#047857">✅ การแก้ไข: Precision Bracket System (เชื่อมต่อ 100%)</text>

  <!-- Right: Manager Card (Anucha Rattanakul) -->
  <rect x="735" y="195" width="220" height="70" rx="14" fill="#ffffff" stroke="#1e3a5f" stroke-width="2" filter="url(#card-shadow)" />
  <text x="845" y="225" font-size="14" font-weight="700" fill="#1e3a5f" text-anchor="middle">Anucha R. (Manager)</text>
  <text x="845" y="248" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">IT Manager</text>

  <!-- Stem from center of Manager -->
  <line x1="845" y1="265" x2="845" y2="285" stroke="#047857" stroke-width="2.5" />

  <!-- Smooth Corner Bridge: right-1/2 (center) to -left-6 (spine) -->
  <!-- Path starts at center (845, 285), goes left to 695 (with corner curve), then down to 301 -->
  <path d="M 845 285 L 705 285 Q 695 285 695 295 L 695 301" fill="none" stroke="#047857" stroke-width="2.5" />
  <circle cx="845" cy="285" r="3.5" fill="#047857" />
  <circle cx="695" cy="285" r="3.5" fill="#047857" />

  <!-- Callout 1: Feeder Bridge -->
  <rect x="870" y="275" width="220" height="42" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
  <text x="880" y="293" font-size="11" font-weight="700" fill="#14532d">1. สะพานแนวนอน (Bridge)</text>
  <text x="880" y="309" font-size="10" font-weight="500" fill="#166534">เชื่อมก้านกลางเข้าหาแกนซ้ายเนียนกริบ</text>

  <!-- Continuous vertical spine from bridge down to Kittipong center -->
  <line x1="695" y1="301" x2="695" y2="455" stroke="#047857" stroke-width="2.5" />

  <!-- Branch 1 into Naruemon -->
  <line x1="695" y1="365" x2="735" y2="365" stroke="#047857" stroke-width="2.5" />
  <rect x="735" y="335" width="220" height="60" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="845" y="362" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Naruemon Pansri</text>
  <text x="845" y="380" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Software Developer</text>

  <!-- Branch 2 into Kittipong (The Last Child) - TERMINATES AT CENTER! -->
  <line x1="695" y1="455" x2="735" y2="455" stroke="#047857" stroke-width="2.5" />
  <rect x="735" y="425" width="220" height="60" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="845" y="452" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Kittipong Sae-ung</text>
  <text x="845" y="470" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">IT Support Specialist</text>

  <!-- Clean corner dot on the last child -->
  <circle cx="695" cy="455" r="4.5" fill="#047857" />

  <!-- Callout 2: Clean termination -->
  <rect x="610" y="495" width="350" height="52" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
  <text x="620" y="515" font-size="11" font-weight="700" fill="#14532d">2. หักศอกรูปตัว L (└──) ที่การ์ดใบสุดท้ายพอดี</text>
  <text x="620" y="531" font-size="10" font-weight="500" fill="#166534">เส้นดิ่งสิ้นสุดที่ top-1/2 (กึ่งกลาง) ของการ์ดใบสุดท้าย</text>
  <text x="620" y="543" font-size="10" font-weight="500" fill="#166534">ไม่มีเส้นเลยห้อยลงมาด้านล่างแม้แต่พิกเซลเดียว</text>

  <!-- Code Implementation Badge -->
  <rect x="610" y="570" width="480" height="120" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="625" y="595" font-size="11" font-weight="700" fill="#38bdf8">Implementation Details (Tailwind CSS):</text>
  <text x="625" y="618" font-size="10" font-family="monospace" fill="#a7f3d0">&lt;!-- Feeder Bridge --&gt; absolute top-0 right-1/2 -left-6 h-4 border-t-2 border-l-2</text>
  <text x="625" y="638" font-size="10" font-family="monospace" fill="#a7f3d0">&lt;!-- Branch Tick   --&gt; absolute -left-6 top-1/2 w-6 h-0.5</text>
  <text x="625" y="658" font-size="10" font-family="monospace" fill="#a7f3d0">&lt;!-- Top Spine     --&gt; isFirst ? 'top-0 h-1/2' : '-top-3 bottom-1/2'</text>
  <text x="625" y="678" font-size="10" font-family="monospace" fill="#a7f3d0">&lt;!-- Bottom Spine  --&gt; {!isLast &amp;&amp; 'absolute -left-6 top-1/2 bottom-0'}</text>
</svg>
